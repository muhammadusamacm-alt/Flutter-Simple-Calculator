workflows:
  ios-debug:
    name: iOS Debug (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    working_directory: flutter_calculator
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Build unsigned debug app
        script: flutter build ios --debug --no-codesign
      - name: Package as .ipa
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r app-debug-unsigned.ipa Payload
    artifacts:
      - app-debug-unsigned.ipa
      - build/ios/iphoneos/Runner.app
